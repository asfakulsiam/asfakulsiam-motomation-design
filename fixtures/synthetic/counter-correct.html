<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic · correct counter, live clock</title>
<style>body{margin:0;font:18px/1.5 system-ui,sans-serif;color:#111;background:#fff}main{padding:2rem}.n{font-size:2.5rem;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .8s ease}
@media (prefers-reduced-motion: no-preference){.js .n:not(.in){transform:translateY(.4em)}}</style></head>
<body><main>
  <h1>Restoration so far</h1>
  <p>Room from <span id="price">BDT 7,800</span> a night</p>
  <p>Local time in Khulna: <time id="clock">--:--:--</time></p>
  <div style="height:1200px"></div>
  <p><span class="n" id="ha">1,250</span> hectares of mangrove replanted</p>
</main>
<script>
  document.documentElement.classList.add("js");
  // the number is always the real value; only its position animates in
  const el = document.getElementById("ha"); new IntersectionObserver(([e]) => e.isIntersecting && el.classList.add("in")).observe(el);
  // a live clock changes on its own: the gate lists it as live and doesn't judge it
  const c = document.getElementById("clock"); const tick = () => { c.textContent = new Date().toTimeString().slice(0, 8); }; tick(); setInterval(tick, 1000);
</script></body></html>
