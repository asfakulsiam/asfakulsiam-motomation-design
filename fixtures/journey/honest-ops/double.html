<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order</title><style>body{margin:0;font:16px/1.5 system-ui;padding:16px}label{display:block;margin:8px 0}input,textarea{display:block;width:100%;max-width:320px;padding:8px;box-sizing:border-box}button{padding:10px 16px;margin-top:8px}[data-err]{color:#a00}</style></head><body><nav aria-label="Main"><a href="/">Home</a> <a href="/misleading.html">Contact</a> <a href="/simulated.html">Demo contact</a> <a href="/saved.html">Preferences</a> <a href="/lost.html">Notes</a> <a href="/unavailable.html">Booking</a> <a href="/double.html">Order</a> <a href="/sales-demo.html">Schedule Demo</a></nav><main><h1>Order</h1><form novalidate aria-label="Order"><label>Name <input name="name"></label><label>Message <textarea name="msg"></textarea></label><button type="submit">Send</button><p data-out aria-live="polite"></p></form></main><script>const f=document.querySelector("form"),o=document.querySelector("[data-out]");f.addEventListener("submit",e=>{e.preventDefault();const v=f.querySelector("input");if(!v.value.trim()){o.setAttribute("role","alert");o.textContent="Please enter your name.";v.setAttribute("aria-invalid","true");return;}v.removeAttribute("aria-invalid"); const b=f.querySelector('button');b.textContent='Sending...';fetch('/api/order',{method:'POST',body:new FormData(f)}).then(r=>{b.textContent='Send';o.setAttribute('role',r.ok?'status':'alert');o.textContent=r.ok?'Thanks, your order was sent.':'Sorry, the order failed. Try again.';}).catch(()=>{b.textContent='Send';o.textContent='Sorry, the order failed. Try again.';});});</script></body></html>
