<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Write to us</title>
<style>body{font:18px/1.5 Georgia,serif;margin:2rem}label,input,textarea,button{display:block;margin:.25rem 0}input,textarea{padding:.5rem;border:1px solid #333}[aria-invalid=true]{border:2px solid #a3271b}.err{color:#a3271b}</style></head>
<body><main>
<h1>Write to us</h1>
<!-- a link that wraps over two lines at 375px (regression: axis J mobile taps its first line box) -->
<p style="font:16px/1.6 monospace;width:20ch">Replies come <a href="#msg">here now</a> is the form.</p>
<!-- on success the form is removed and replaced by a message, as a React or Vue app often does (regression: axis J forms) -->
<div class="region">
<form id="msg" novalidate aria-label="Message">
  <label for="name">Your name</label><input id="name" name="name" required>
  <label for="text">Message</label><textarea id="text" name="text" required></textarea>
  <p id="err" class="err" role="alert" hidden></p>
  <button type="submit">Send message</button>
</form>
</div>
</main>
<script>
const f = document.getElementById("msg"), err = document.getElementById("err"), btn = f.querySelector("button");
f.addEventListener("submit", async (e) => {
  e.preventDefault(); err.hidden = true;
  const empty = [...f.querySelectorAll("[required]")].filter((x) => !x.value.trim());
  for (const x of f.querySelectorAll("[required]")) x.setAttribute("aria-invalid", String(!x.value.trim()));
  if (empty.length) { err.textContent = "Please fill in your name and a message."; err.hidden = false; empty[0].focus(); return; }
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch("/api/message", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(f))) });
    if (!r.ok) throw new Error(r.status);
    const done = document.createElement("div"); done.setAttribute("role", "status"); done.innerHTML = "<h2>Thanks, your message was sent.</h2>";
    f.replaceWith(done);
  } catch { err.textContent = "We couldn't send that. Try again."; err.hidden = false; btn.disabled = false; btn.textContent = "Send message"; }
});
</script>
</body></html>
