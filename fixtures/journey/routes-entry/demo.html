<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo</title><style>body{margin:0;font:16px/1.5 system-ui;padding:16px}</style></head><body><nav aria-label="Main"><a href="/">Home</a></nav><main><h1>Request a demo</h1><form novalidate aria-label="Request a demo"><label>Name <input name="name"></label><button type="submit">Continue</button><p data-out aria-live="polite"></p></form></main><script>const f=document.querySelector('form'),o=document.querySelector('[data-out]');f.addEventListener('submit',e=>{e.preventDefault();const v=f.querySelector('input');if(!v.value.trim()){o.setAttribute('role','alert');o.textContent='Please enter your name.';return;}localStorage.setItem('demo-req',v.value);f.querySelector('button').textContent='Saving...';setTimeout(()=>location.assign('/confirmed.html'),200);});</script></body></html>
