  .wide { width: 720px; background: #eee; }                    /* overflow: wider than a 375px phone */

<script>
  // numbers: a count-up that starts at 0 and only runs when the element enters the screen, so "0" is what shows first
  const run = (el, to) => { const t0 = performance.now(); const f = (t) => { const p = Math.min(1, (t - t0) / 1200); el.textContent = Math.round(to * p).toLocaleString("en-US"); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); };
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting && !e.target.dataset.done) { e.target.dataset.done = 1; run(e.target, +e.target.dataset.to); } }));
  document.getElementById("hectares").dataset.to = 1250; document.getElementById("trees").dataset.to = 48000;
  document.querySelectorAll(".n").forEach((el) => io.observe(el));
