name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix: { node: [18, 20] }
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - name: Lint repository, data, versions and dist
        run: node scripts/check-repo.mjs
      - name: Template rules bite and templates don't drift (dials 1–3, tier in range, pins ≤ 2, timing sheets)
        run: node tests/templates/template-rules.test.mjs
      - name: Matched-arm turn cap is exact (fake claude)
        run: node tests/evals/turn-cap.test.mjs
      - name: MCP server answers the protocol (raw stdio session)
        run: node tests/mcp/session.mjs
      - name: Smoke-test skill scripts
        working-directory: skills/asfakulsiam-motomation-design
        run: |
          set -e
          node --version
          node scripts/collide.mjs > /dev/null                       # unseeded: real randomness (caught the Node 18 crypto bug)
          node scripts/collide.mjs --seed 42 > /tmp/a.txt
          node scripts/collide.mjs --seed 42 > /tmp/b.txt
          cmp /tmp/a.txt /tmp/b.txt                                  # seeded runs are reproducible
          node scripts/search.mjs motion "pinned scrub" > /dev/null
          node scripts/contrast.mjs --palettes > /dev/null
          node --check scripts/gate.mjs
          # no Playwright here: the gate must refuse to pass (exit 3, "not verified — no browser"), never print PASS
          set +e; node scripts/gate.mjs examples/html/motomation-film.html > /tmp/gate.txt; code=$?; set -e
          cat /tmp/gate.txt; test "$code" = 3 && grep -q "not verified — no browser" /tmp/gate.txt
          cd "$(mktemp -d)" && node "$GITHUB_WORKSPACE/skills/asfakulsiam-motomation-design/scripts/memory.mjs" recent > /dev/null
  examples:
    strategy:
      fail-fast: false
      matrix: { node: [18, 20] }
    name: examples (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - name: Type-check React examples (strict)
        run: |
          mkdir -p /tmp/tc && cp -r skills/asfakulsiam-motomation-design/examples /tmp/tc/ex && cd /tmp/tc
          npm init -y >/dev/null
          npm i --silent typescript@5 react@19 react-dom@19 @types/react@19 @types/react-dom@19 gsap@3 @gsap/react lenis@1
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "target": "ES2022", "module": "ESNext", "moduleResolution": "Bundler", "jsx": "react-jsx",
            "strict": true, "noEmit": true, "skipLibCheck": true, "noUnusedLocals": true, "lib": ["DOM", "DOM.Iterable", "ES2022"], "types": [] },
            "include": ["ex/**/*.ts", "ex/**/*.tsx"] }
          JSON
          npx tsc -p tsconfig.json
  gate-fixtures:
    # The real Delivery Gate in a real browser. Playwright is not a dependency of the skill, so this job installs it
    # itself. If the install fails (no network, registry down) the job says "not verified" instead of passing; once
    # Playwright is installed, the fixtures are enforced: good must pass, bad must fail with the expected errors.
    name: gate fixtures (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Playwright + Chromium (optional)
        id: pw
        continue-on-error: true
        run: |
          npm i --no-save --no-package-lock playwright@1.59.0
          npx playwright install --with-deps chromium
      - name: Gate the fixtures (enforced when Playwright installed)
        run: |
          if [ "${{ steps.pw.outcome }}" = "success" ]; then
            REQUIRE_BROWSER=1 node scripts/check-fixtures.mjs
          else
            echo "::warning::Playwright could not be installed; gate fixtures not verified"
            node scripts/check-fixtures.mjs
          fi
      - name: Tier 4 reduced-motion stills (no canvas, still, own composition)
        if: steps.pw.outcome == 'success'
        run: node tests/components/rm-stills.test.mjs
      - name: Gallery gate finishes inside its timeout
        if: steps.pw.outcome == 'success'
        working-directory: skills/asfakulsiam-motomation-design
        run: |
          # the gallery is ~36,000px tall; before --timeout this step could run for hours. Exit 3 (timed out) is
          # acceptable here, hanging is not. Pass/fail of the gallery itself is not asserted.
          set +e; timeout 900 node scripts/gate.mjs examples/gallery/index.html --timeout 600 > /tmp/gallery.txt; code=$?; set -e
          tail -5 /tmp/gallery.txt; echo "gate exit $code"
          test "$code" != 124
      - name: Timeout watchdog kicks in on a synthetic tall page
        if: steps.pw.outcome == 'success'
        run: |
          set +e; node skills/asfakulsiam-motomation-design/scripts/gate.mjs fixtures/synthetic/tall.html --timeout 20 > /tmp/tall.txt; code=$?; set -e
          cat /tmp/tall.txt; test "$code" = 3 && grep -q "not verified — timed out after 20s" /tmp/tall.txt
