<style>:root{--ground:#f4f1ea;--surface:#fbf9f4;--ink:#1c1b19;--muted:#5d5a53;--line:rgba(28,27,25,.16);--accent:#c2361d;

*{box-sizing:border-box}html{background:var(--ground);color:var(--ink)}body{margin:0;font:17px/1.55 var(--font-text);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--ground)}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--ground);padding:10px 14px;z-index:100;border-radius:6px}.skip:focus{top:12px}
h1,h2,h3{font-family:var(--font-display);font-weight:500}
.lede{max-width:44rem;margin:0 24px 12vh;font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;padding:0 24px;max-width:1240px;margin:0 auto}
@media (min-width:900px){.layout{grid-template-columns:180px minmax(0,1fr)}}
.family{font-size:clamp(2.2rem,5vw,3.6rem);margin:12vh 0 24px;letter-spacing:-.02em;border-top:1px solid var(--line);padding-top:16px}
.card{margin:0 0 72px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card-head h3{font-size:clamp(1.4rem,2.6vw,2rem);margin:0}
.tier{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.what{max-width:46rem;margin:6px 0 18px}
.stage{margin:0 0 18px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 28px;margin:0 0 10px;font-size:15px}
.notes dt{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.notes dd{margin:2px 0 0}
.file{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin:0}
.file code{font-family:var(--font-mono);overflow-wrap:anywhere}
.hint{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:14px 0 0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.pill{font:inherit;font-size:15px;padding:10px 16px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.foot{border-top:1px solid var(--line);margin-top:12vh;padding:24px;font-size:14px;color:var(--muted)}
code{overflow-wrap:anywhere}
.lede-head{font-family:var(--font-display);font-weight:500;color:var(--ink)}
.toolbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 24px;background:rgba(244,241,234,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);font:14px/1.3 var(--font-mono)}
.tb-search{flex:1;min-width:200px;max-width:460px}.tb-search input{width:100%;font:15px var(--font-text);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tb-count{margin:0;color:var(--muted)}
.tb-switch,.tb-btn{display:inline-flex;align-items:center;gap:8px;font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;padding:6px 0}
.tb-btn{border:1px solid var(--ink);border-radius:8px;padding:6px 12px;background:var(--surface)}
.tb-track{position:relative;width:36px;height:20px;border-radius:999px;background:#c9c3b6;transition:background .18s ease-out}.tb-track span{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .18s ease-out}
.tb-switch[aria-checked=true] .tb-track{background:var(--accent)}.tb-switch[aria-checked=true] .tb-track span{transform:translateX(16px)}
.tb-phone{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:60px 16px 16px;background:rgba(28,27,25,.72)}
.tb-phone iframe{width:395px;max-width:100%;height:min(760px,calc(100vh - 80px));border:10px solid var(--ink);border-radius:28px;background:var(--ground)}
.tb-close{position:absolute;top:14px;right:16px;background:var(--ground)}
.rm *{transition-duration:0s!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

ame:"Ink Fill",family:"type",tier:"2",what:"A statement starts in the muted colour and fills with ink word by word as the reader scrolls through it.",use_when:"Manifestos, about statements, a single paragraph that is the page's idea.",avoid_when:"More than one per page; text the reader needs before scrolling (it must stay readable when muted).",reduced_motion:"The whole statement is in ink from the start.",file:"examples/components/type/ink-fill.tsx"},{id:"letter-relay",name:"Letter Relay",family:"type",tier:"2",what:"A large hero name shrinks and travels into a fixed header slot letter by letter as you scroll the first screen, so the name hands itself to the navigation.",use_when:"Portfolios and personal brands where the name is the identity.",avoid_when:"Long names (over ~16 characters); pages without a fixed header; product pages.",reduced_motion:"The hero name and the header name are both static; no scroll listener runs.",file:"examples/components/type/letter-relay.tsx"},{id:"neighbour-moves",name:"Neighbour Moves",family:"type",tier:"2",what:"Each letter of a name has its own small move on hover (lift, tilt, stretch, spin, drop), so the word feels like a cast of characters.",use_when:"Personal names, studio names and play-mood logotypes of 3\u201312 letters.",avoid_when:"Navigation, body text, or brands that must feel calm.",reduced_motion:"No hover moves.",file:"examples/components/type/neighbour-moves.tsx"},{id:"pressure-type",name:"Pressure Type",family:"type",tier:"2",what:"Each letter of one display word stretches wider and heavier as the cursor nears it, like pressing into rubber.",use_when:"Playful, elastic or physical brands with a variable font that has wdth and wght axes.",avoid_when:"Fonts without variable axes; more than one word; any body copy.",reduced_motion:"Letters stay at the base width and weight.",file:"examples/components/type/pressure-type.tsx"},{id:"scroll-float",name:"Scroll Float",family:"type",tier:"2",what:"Letters of a display line rise and settle into place one by one, driven by scroll position, so scrolling back reverses it.",use_when:"Play-mood display lines that should feel buoyant; one line per section.",avoid_when:"Serious or institutional briefs; text that must be readable before it settles (prices, dates).",reduced_motion:"Letters sit in place; no scroll listener runs.",file:"examples/components/type/scroll-float.tsx"},{id:"split-flap",name:"Split Flap",family:"type",tier:"2",what:"Each character flips through the alphabet to its value like a departure board, settling left to right; changing the value flips again.",use_when:"Schedules, line-ups, menus, travel, times and short codes.",avoid_when:"Long text; values the reader must trust mid-animation (the final value is announced, not the flips).",reduced_motion:"Shows the new value at once.",file:"examples/components/type/split-flap.tsx"},{id:"width-sprint",name:"Width Sprint",family:"type",tier:"2",what:"A display word stretches wider the faster you scroll and relaxes back when you stop, using the font's width axis.",use_when:"Sport, speed, events and launches with a variable font that has a wdth axis.",avoid_when:"Fonts without wdth; more than one element; layouts where the word could overflow at its widest.",reduced_motion:"The word stays at its base width.",file:"examples/components/type/width-sprint.tsx"},{id:"ascii-text",name:"ASCII Text",family:"text",tier:"2",what:"A word drawn as a grid of characters, sampled from the word's own letterforms; it settles out of character noise when it enters the screen.",use_when:"The concept is code, print terminals, telegrams, early computing or textile grids; one short word at display size.",avoid_when:"Anything longer than about 12 characters; small sizes (it becomes noise); as the only copy of important text.",reduced_motion:"The finished character drawing, with no noise.",file:"examples/components/text/ascii-text.tsx"},{id:"glitch",name:"Glitch",family:"text",tier:"2",what:"On hover, focus or tap, the word tears for a moment: two offset colour copies slip sideways in thin bands, then it settles. Never loops.",use_when:"The concept is a broken signal, a corrupted file, a jump cut or an error that matters; one word or a short label.",avoid_when:"Body text; anything that must be read during the effect; brands that want calm; more than one per page.",reduced_motion:"Plain text; nothing tears.",file:"examples/components/text/glitch.tsx"},{id:"rotating-words",name:"Rotating Words",family:"text",tier:"1",what:"One word in a sentence turns over to the next, like a rolling counter, a few times, then rests. The slot is as wide as the longest word (with the sentence's ending attached), so nothing around it moves.",use_when:"The sentence really has several true endings (who you serve, what you make), and the rest of the line stays still.",avoid_when:`More than one per page; endings that are adjectives about yourself ("innovative", "bold"); the hero's only message.`,reduced_motion:"The first word, still; all the words are listed for assistive tech.",file:"examples/components/text/rotating-words.tsx"},{id:"scramble-on-hover",name:"Scramble on Hover",family:"text",tier:"2",what:"Letters near the pointer scramble into other glyphs, like a magnet passing over iron filings, and settle back as it moves on. Unlike Decode, it reacts locally, where the cursor is.",use_when:"A short label the visitor plays with (a name, a nav word, a project title) on a code, cipher or signal concept.",avoid_when:"Words the visitor must read while pointing at them (buttons with actions); long text; for a one-time reveal (use Decode).",reduced_motion:"Plain text; nothing scrambles.",file:"examples/components/text/scramble-on-hover.tsx"},{id:"shiny-text",name:"Shiny Text",family:"text",tier:"1",what:"A single band of light passes once across a short label, like light catching foil or a brass plate, when it enters the screen and again on hover.",use_when:"The material is metal, foil, glass or a printed seal; one short label or badge.",avoid_when:'Large headlines (the moving gradient is paint-heavy: cost grows with area); body text; infinite loops; as a "premium" sticker on everything.',reduced_motion:"Solid ink, no light band.",file:"examples/components/text/shiny-text.tsx"},{id:"typewriter",name:"Typewriter",family:"text",tier:"1",what:"A line types itself out, character by character, when it scrolls into view, with a caret that fades once the line is complete.",use_when:"The concept is a terminal, a typed letter, a dispatch or a confession; one line, read once.",avoid_when:"Headlines the visitor needs at once; more than one per screen; long paragraphs; anything repeated on every visit.",reduced_motion:"The whole line is there from the start, with no caret.",file:"examples/components/text/typewriter.tsx"},{id:"aperture",name:"Aperture",family:"scroll",tier:"2",what:"The next section opens through a growing circle (an iris) as you scroll into it, from a small porthole to full bleed.",use_when:"A chapter change that is a real threshold: entering a room, a lens, a window, a reveal of the product.",avoid_when:"Every section; content that must be readable at the edges before the iris opens.",reduced_motion:"The section is fully open from the start.",file:"examples/components/scroll/aperture.tsx"},{id:"darkroom-develop",name:"Darkroom Develop",family:"scroll",tier:"2",what:"A photograph develops from blank paper as it scrolls in: pale and flat first, then contrast, then tone, like a print in the tray.",use_when:"Photography, archives, memory, analogue brands; one image per screen.",avoid_when:"Product shots the buyer must inspect; galleries of many small images.",reduced_motion:"The photo is fully developed from the start.",file:"examples/components/scroll/darkroom-develop.tsx"},{id:"horizontal-reel",name:"Horizontal Reel",family:"scroll",tier:"2",what:"A section pins and vertical scroll pulls a strip of frames sideways, like film through a gate; a frame counter follows.",use_when:"Film, gallery, timeline and process concepts with 4\u201310 frames.",avoid_when:"Content people need to scan quickly; more than one per page; frames that need reading time.",reduced_motion:"The frames become a normal horizontally scrollable row with snap points.",file:"examples/components/scroll/horizontal-reel.tsx"},{id:"reading-rail",name:"Reading Rail",family:"scroll",tier:"1",what:"A thin rail at the top or edge of the screen fills as you read an article, with an optional chapter label that changes at each heading.",use_when:"Long reads, case studies and documentation pages.",avoid_when:"Short pages; landing pages; next to another progress indicator.",reduced_motion:"The rail still reflects progress (it's information, not decoration) but moves in 5% steps instead of continuously.",file:"examples/components/scroll/reading-rail.tsx"},{id:"stacked-deck",name:"Stacked Deck",family:"scroll",tier:"2",what:"Cards stick one after another and stack like a deck; covered cards step back and dim, leaving their titles as a table of contents.",use_when:"Sequences, case studies, steps and services with 3\u20136 items.",avoid_when:"More than 6 cards; cards taller than the viewport; content that must be compared side by side.",reduced_motion:"Cards stack with sticky positioning but don't scale or dim.",file:"examples/components/scroll/stacked-deck.tsx"},{id:"thread",name:"Thread",family:"scroll",tier:"2",what:"One line draws itself down the page as you scroll, linking sections like a seam, a route or a timeline.",use_when:"Journeys, timelines, craft (stitching, drawing), routes and process pages.",avoid_when:"As decoration on a page without a journey; together with another scroll signature.",reduced_motion:"The line is fully drawn and still.",file:"examples/components/scroll/thread.tsx"},{id:"velocity-marquee",name:"Velocity Marquee",family:"scroll",tier:"2",what:"A looping marquee that drifts on its own, speeds up with scroll speed, follows scroll direction and leans (skews) while you scroll fast.",use_when:"Sport, launches, events and a single line of brand words between sections.",avoid_when:"Content the reader needs (prices, dates); more than one marquee per page.",reduced_motion:"A static, wrapped row of the same words.",file:"examples/components/scroll/velocity-marquee.tsx"},{id:"image-trail",name:"Image Trail",family:"cursor",tier:"2",what:"Moving the cursor across an area drops a trail of images that appear, linger briefly and shrink away, cycling through a set.",use_when:"Photographers, archives, studios with a deep body of work; one area per page.",avoid_when:"Fewer than 5 images; e-commerce product pages; over text that must be read.",reduced_motion:"The images are shown as a static row instead.",file:"examples/components/cursor/image-trail.tsx"},{id:"lens",name:"Lens",family:"cursor",tier:"2",what:"A circle follows the cursor and reveals a second layer underneath: sketch under final, night under day, before under after.",use_when:"The two layers are the story (process, transformation, hidden detail).",avoid_when:"The second layer is decoration; text-heavy layers; more than one per page.",reduced_motion:'The lens jumps to the cursor without easing; a "Show the other layer" toggle shows the second layer at full size.',file:"examples/components/cursor/lens.tsx"},{id:"pixel-wake",name:"Pixel Wake",family:"cursor",tier:"2",what:"The cursor leaves a trail of square pixels on a grid that fade out behind it, like a wake on a low-resolution screen.",use_when:"Digital, pixel, retro, game and screen-themed concepts; usually only over the hero.",avoid_when:"Over body text; on calm or luxury briefs; together with another cursor effect.",reduced_motion:"No trail.",file:"examples/components/cursor/pixel-wake.tsx"},{id:"seismograph-line",name:"Seismograph Line",family:"cursor",tier:"2",what:"A hairline divider bends toward the cursor as it passes and springs back with a small wobble, like a needle on a seismograph.",use_when:"Dividers on calm editorial pages where one living detail is enough; sound, measurement and science brands.",avoid_when:"Every divider; busy pages; pages that already have a cursor effect.",reduced_motion:"A straight line.",file:"examples/components/cursor/seismograph-line.tsx"},{id:"target-cursor",name:"Target Cursor",family:"cursor",tier:"2",what:"A small crosshair follows the cursor; over anything clickable it snaps out into corner brackets that frame the target.",use_when:"Precision tools, cameras, games, architecture and engineering concepts.",avoid_when:"Content sites; together with another cursor effect; when it would hide the system cursor (it doesn't by default).",reduced_motion:"Brackets jump to targets without easing.",file:"examples/components/cursor/target-cursor.tsx"},{id:"tilt-card",name:"Tilt Card",family:"cursor",tier:"2",what:"A card rotates in 3D toward the cursor with a soft moving highlight, like holding a physical card to the light.",use_when:"Physical objects: tickets, cards, passes, packaging, a single product.",avoid_when:"Grids of many cards; text-heavy cards; cards that are links to long content (the motion distracts).",reduced_motion:"Flat card, no rotation or highlight.",file:"examples/components/cursor/tilt-card.tsx"},{id:"aurora",name:"Aurora",family:"backgrounds",tier:"4",what:"Curtains of northern light hang across a night sky: a sharp lower hem, fading upward in vertical rays, folding slowly. A small WebGL shader draws it; a CSS poster stands in everywhere else.",use_when:"The subject is the far north, night, cold, observation, polar travel or a planetarium: behind a hero or a single quiet section.",avoid_when:'As a generic "AI glow" background; behind body copy; light themes; pages that already run WebGL.',reduced_motion:"One still frame of the curtains (WebGL), or the poster.",file:"examples/components/backgrounds/aurora.tsx"},{id:"beams",name:"Beams",family:"backgrounds",tier:"4",what:"Parallel shafts of sunlight fall through a row of high windows (a clerestory, a mill, a stage rig) at one shared angle and sway slightly in depth. CSS 3D only: soft gradient shafts rotated in a perspective space; no WebGL, because transforms are enough here.",use_when:"Churches, mills, warehouses, galleries, theatres, anything lit through high windows: behind one dark hero.",avoid_when:'Bright themes; as "spotlight on our product" decoration; together with other moving backgrounds.',reduced_motion:"The shafts, still, at their resting angles (this is also the poster).",file:"examples/components/backgrounds/beams.tsx"},{id:"contour-lines",name:"Contour Lines",family:"backgrounds",tier:"2",what:"Topographic contour lines drawn as SVG that slowly drift, like a map breathing; deterministic from a seed.",use_when:"Landscape, outdoors, climate, geography, agriculture and mapping concepts.",avoid_when:"Urban or tech brands without a land story; behind dense text.",reduced_motion:"Still lines.",file:"examples/components/backgrounds/contour-lines.tsx"},{id:"dot-field",name:"Dot Field",family:"backgrounds",tier:"2",what:"A grid of dots that swell and push away from the cursor, then ease back, like a pin-art board.",use_when:"Technical, structural, data or grid-led concepts; behind a hero with little text.",avoid_when:"Behind body text; organic or luxury briefs; together with a cursor signature.",reduced_motion:"A still dot grid.",file:"examples/components/backgrounds/dot-field.tsx"},{id:"globe",name:"Globe",family:"backgrounds",tier:"4",what:"A sphere of evenly spaced dots turns slowly, the far side faint, with a few brighter markers for real places (lat/lon). WebGL points; a CSS dotted disc stands in everywhere else.",use_when:"The business is genuinely about places on Earth (shipping, a diaspora, offices in named cities, a travel route), and the markers are real.",avoid_when:'As a generic "global" or "scale" signal; with invented markers; on pages that already run WebGL; at small sizes (the dots turn to noise).',reduced_motion:"The globe, still, facing the first marker.",file:"examples/components/backgrounds/globe.tsx"},{id:"grain",name:"Grain",family:"backgrounds",tier:"1",what:"A film-grain layer over a section or the whole page, static by default or gently flickering at a low frame rate.",use_when:"Analogue, photographic, warm or printed moods; to take the digital edge off flat colour.",avoid_when:"Over small text at high opacity; on clinical, technical brands; animated on low-end mobile.",reduced_motion:"Static grain.",file:"examples/components/backgrounds/grain.tsx"},{id:"halftone",name:"Halftone",family:"backgrounds",tier:"2",what:"Renders an image as print dots on a canvas, sized by brightness, like a newspaper photo; dots can grow in as it enters the screen.",use_when:"Print, newspaper, zine, poster, protest and retro concepts.",avoid_when:"Product photos people must inspect; portraits where likeness matters; many on one page.",reduced_motion:"Dots render at full size immediately.",file:"examples/components/backgrounds/halftone.tsx"},{id:"light-sweep",name:"Light Sweep",family:"backgrounds",tier:"1",what:"A slow band of light crosses a surface every few seconds, like sun moving through a window or a scanner pass.",use_when:"Architecture, light, time-of-day and hospitality concepts; behind one hero or one card.",avoid_when:'Behind text where the band would drop contrast; as a "shimmer" on buttons; more than one per screen.',reduced_motion:"No sweep.",file:"examples/components/backgrounds/light-sweep.tsx"},{id:"liquid-field",name:"Liquid Field",family:"backgrounds",tier:"4",what:"Slow flowing colour like ink in water or silk in wind, drawn by a tiny WebGL fragment shader with a CSS gradient fallback.",use_when:"The material really is liquid, fabric, light or weather; behind a hero with one line of type.",avoid_when:'As generic "AI gradient" decoration; behind body text; on pages that already use WebGL.',reduced_motion:"A still frame of the same colours.",file:"examples/components/backgrounds/liquid-field.tsx"},{id:"mesh-gradient",name:"Mesh Gradient",family:"backgrounds",tier:"4",what:"Four soft pools of colour drift very slowly over a ground colour and blend where they meet, like a dyed silk or a weather map. CSS only: each pool is a radial gradient moved with transform; no blur filter, no WebGL.",use_when:"The palette itself is the brand (a paint, a cosmetics line, a dye house, a weather service), and a calmer, cheaper option than Liquid Field is right.",avoid_when:'As the default "modern" hero background; behind body copy; with more than one other effect on the page; with clashing colours (the overlaps make new ones).',reduced_motion:"The pools, still, in their resting places (this is also the poster).",file:"examples/components/backgrounds/mesh-gradient.tsx"},{id:"meteors",name:"Meteors",family:"backgrounds",tier:"4",what:"Now and then a thin streak of light crosses a night sky at one shared angle and burns out; long quiet gaps between them. CSS only: each streak is a gradient line moved with transform.",use_when:"Night skies, observatories, wishes, launches that are literal (a rocket club), New Year: behind one dark hero.",avoid_when:'As "speed" or "innovation" decoration; light themes; more than one sky per page; busy sections where a flicker at the edge distracts from reading.',reduced_motion:"A still sky with two frozen streaks (this is also the poster).",file:"examples/components/backgrounds/meteors.tsx"},{id:"particle-field",name:"Particle Field",family:"backgrounds",tier:"4",what:"Dust drifting through a beam of light: soft particles at three depths, the near ones larger and brighter, all moving slowly sideways and bobbing. WebGL points; a CSS poster of scattered motes stands in elsewhere.",use_when:"Cinema, projection, workshops, old rooms, archives, snowfall or pollen: a quiet atmosphere behind a dark hero.",avoid_when:'"Tech" or "data" decoration; as a starfield warp; behind text-heavy sections; on pages that already run WebGL. For a cursor-reactive grid use Dot Field.',reduced_motion:"The particles, still (one WebGL frame), or the poster.",file:"examples/components/backgrounds/particle-field.tsx"},{id:"bento-reveal",name:"Bento Reveal",family:"layout",tier:"1",what:"A modular grid of mixed-size tiles that enter in reading order with a short stagger the first time the grid scrolls in.",use_when:"Content that truly has mixed weights (one big feature, several small facts).",avoid_when:"Equal-weight content (use a list); as the default landing layout (it's overused); more than one per page.",reduced_motion:"Tiles are visible from the start.",file:"examples/components/layout/bento-reveal.tsx"},{id:"curve-carousel",name:"Curve Carousel",family:"layout",tier:"2",what:"Cards sit on a shallow arc; the focused card is upright and in front, its neighbours tilt and recede. Arrow keys, buttons, drag and swipe move it.",use_when:"3\u20139 case studies or products where one at a time is the point.",avoid_when:"Content people need to compare; more than 9 items; as autoplaying decoration.",reduced_motion:"Cards change position without easing.",file:"examples/components/layout/curve-carousel.tsx"},{id:"dock",name:"Dock",family:"layout",tier:"2",what:"A row of icon buttons that magnify smoothly as the cursor passes along them, neighbours growing a little less.",use_when:"App-like tool collections, launchers and playful personal sites with 4\u20138 actions.",avoid_when:"Primary navigation that needs labels; touch-first sites; more than 8 items.",reduced_motion:"No magnification.",file:"examples/components/layout/dock.tsx"},{id:"flowing-menu",name:"Flowing Menu",family:"layout",tier:"2",what:"A big typographic list of links; hovering an item rolls a band over it from the edge the cursor entered, carrying a marquee of the item's words.",use_when:"Portfolio and studio navigation or project indexes with 3\u20138 entries.",avoid_when:"Primary site navigation on product sites; long lists; touch-first audiences.",reduced_motion:"Hover shows the band instantly with still text.",file:"examples/components/layout/flowing-menu.tsx"},{id:"infinite-canvas",name:"Infinite Canvas",family:"layout",tier:"2",what:"Drag (or use arrow keys) to pan an endless wall of tiles that repeats in every direction, with a little momentum when you let go.",use_when:"The Gallery Wall archetype: archives, mood boards, studios with lots of visual work.",avoid_when:"Fewer than ~12 tiles; content that needs order; as the only way to reach the work (also provide a list).",reduced_motion:"No momentum; panning still works.",file:"examples/components/layout/infinite-canvas.tsx"},{id:"sticky-index",name:"Sticky Index",family:"layout",tier:"1",what:"A sticky side index lists the page's sections and highlights the one you are reading, with a marker that slides between entries.",use_when:"Long case studies, reports, documentation, annual reviews.",avoid_when:"Short pages; mobile (it collapses to a top select); landing pages.",reduced_motion:"The marker jumps instead of sliding.",file:"examples/components/layout/sticky-index.tsx"},{id:"animated-list",name:"Animated List",family:"ui",tier:"1",what:"Entries arrive one at a time, like orders coming into a kitchen or messages into a log: each slides up into its slot and settles. It plays once, then the list is simply a list.",use_when:"The content really arrives over time (orders, sign-ups, sensor readings, a changelog), and showing the arrival explains the product.",avoid_when:'Fake "live activity" or social proof; long lists (over about 8 entries); content the visitor needs to scan at once.',reduced_motion:"Every entry is there from the start.",file:"examples/components/ui/animated-list.tsx"},{id:"confetti",name:"Confetti",family:"ui",tier:"2",what:"Paper pieces burst from a point, tumble and flutter down under gravity and air drag, and are gone in under two seconds. Fired by you, from code, at a real moment.",use_when:"A genuine, rare success the visitor caused: an order placed, a donation made, a course finished, a wedding RSVP. Once.",avoid_when:"Page load; every button; form validation; serious contexts (payments for bills, health, legal); repeated triggers. For small click feedback use Click Spark.",reduced_motion:"No particles at all; your success message carries the moment.",file:"examples/components/ui/confetti.tsx"},{id:"device-mockup",name:"Device Mockup",family:"ui",tier:"1",what:"A phone, browser or laptop frame drawn in CSS around real content (a screenshot or live markup). For a tall screenshot, pointing at the screen scrolls it slowly to the bottom, like someone reading.",use_when:"Showing the actual product screen (an app, a site you built) where the device tells the visitor where it runs.",avoid_when:'Stock "phone with a gradient" decoration; floating several devices at angles; screens with fake data; when the screen alone, unframed, reads better.',reduced_motion:"The screen stays at the top; it can still be scrolled with the wheel or keyboard.",file:"examples/components/ui/device-mockup.tsx"},{id:"glare-card",name:"Glare Card",family:"ui",tier:"2",what:"A flat, laminated card with a foil sheen: a soft band of colour and a sharp white glint slide across it as the pointer moves, the way a hologram on an ID card or a trading card catches light. The card itself never tilts (for tilt, use Tilt Card).",use_when:"Passes, tickets, membership cards, collectibles, certificates: one small card that is a physical object.",avoid_when:"Large surfaces (the blend is paint-heavy: its cost grows with area); photos of people; grids of many cards; anything that must look sober.",reduced_motion:"A still, faint sheen at one angle; no glint movement.",file:"examples/components/ui/glare-card.tsx"},{id:"glow-border",name:"Glow Border",family:"ui",tier:"1",what:"The edge of a card lights up nearest the pointer, as if the pointer were a lamp held close to it; the light fades along the edge with distance. Only the border glows, never the surface.",use_when:"A row or grid of dark cards or inputs where the pointer's position should feel physical (a control panel, a studio's service list, pricing tiers).",avoid_when:"Light themes with low-contrast borders; single cards (no neighbours to compare); a page already using Spotlight Card on the same cards.",reduced_motion:"A steady, faint border.",file:"examples/components/ui/glow-border.tsx"},{id:"icon-cloud",name:"Icon Cloud",family:"ui",tier:"2",what:"Labels or small icons sit on the surface of an invisible ball that turns slowly; dragging spins it and it coasts to a stop. The near side is large and sharp, the far side small and faint.",use_when:"A collection the visitor browses for the pleasure of it (a herbarium's species, a type foundry's glyphs, a band's setlist history), with the full list available in text.",avoid_when:'A logo wall of "technologies we use"; as navigation; more than about 40 items; small screens where a plain list reads better (below 300px wide it falls back to a wrapped list).',reduced_motion:"The ball, still, at a fixed angle; dragging still turns it (the visitor's own motion).",file:"examples/components/ui/icon-cloud.tsx"},{id:"loader-skeleton",name:"Loader Skeleton",family:"ui",tier:"1",what:"Grey placeholder shapes in the exact layout of the content that's coming (an avatar, a title, a few lines), with a faint light passing over them, so the page doesn't jump when the content lands.",use_when:"Content whose layout you know is loading (a card, a list row, a profile, an article), for waits over about 300ms.",avoid_when:"Waits you can't predict the shape of (use Loader Spinner); placeholders that don't match the real layout (they cause the jump they're meant to prevent); whole pages of skeletons.",reduced_motion:"The same shapes, with no passing light.",file:"examples/components/ui/loader-skeleton.tsx"},{id:"loader-spinner",name:"Loader Spinner",family:"ui",tier:"1",what:"A thin ring whose arc stretches and shortens as it turns, for waits of unknown length. It only appears after a short delay, so fast loads never flash a spinner.",use_when:"A wait you can't measure (a search, a payment check) inside a button, a panel or a page area.",avoid_when:"Waits you can measure (show progress instead); content loading where the layout is known (use Loader Skeleton); whole-page splash screens.",reduced_motion:"The ring holds still at three-quarters and the label is shown; nothing turns.",file:"examples/components/ui/loader-spinner.tsx"},{id:"orbiting-circles",name:"Orbiting Circles",family:"ui",tier:"2",what:"Small badges travel on one or two thin circular orbits around a centre, staying upright as they go; the outer ring turns the other way, more slowly. Pointing at it stops the orbits.",use_when:"A real centre with real satellites: a cooperative and its member farms, a studio and its long-term clients, a hub airport and its routes.",avoid_when:'The generic "integrations around our logo" picture; more than about 10 satellites; anything the visitor must read while it moves (list them in text too).',reduced_motion:"The same arrangement, still.",file:"examples/components/ui/orbiting-circles.tsx"},{id:"rainbow-border",name:"Rainbow Border",family:"ui",tier:"1",what:"A thin border made of a turning colour wheel around a card or button. It turns while you point at or focus the element and rests otherwise.",use_when:'One element that is literally about colour (a paint, a print shop, a palette tool, a pride event), or the single "new" item in a list.',avoid_when:'As generic "AI glow"; on more than one element per screen; serious or quiet brands; around body text blocks.',reduced_motion:"The same colour border, still.",file:"examples/components/ui/rainbow-border.tsx"},{id:"shimmer-button",name:"Shimmer Button",family:"ui",tier:"1",what:"A button that a narrow band of light crosses once when you point at it or focus it, and that presses down slightly when clicked.",use_when:"The one primary action on a dark or metallic surface (book, reserve, buy) where a little glint suits the material.",avoid_when:"More than one per screen; secondary actions; a page already using Light Sweep; light, paper-like brands (the glint reads as plastic).",reduced_motion:"No band; the press still darkens the button (colour, not movement).",file:"examples/components/ui/shimmer-button.tsx"},{id:"spotlight-card",name:"Spotlight Card",family:"ui",tier:"1",what:"A dark card with a soft pool of light that follows the pointer across its surface, like a torch on a wall.",use_when:"Night, theatre, cinema, exhibition or archive concepts: a grid of a few dark cards the visitor explores.",avoid_when:"Light surfaces (the pool vanishes); a grid where every card already moves; content that must be read evenly lit.",reduced_motion:"A fixed, soft pool near the top of the card.",file:"examples/components/ui/spotlight-card.tsx"},{id:"terminal",name:"Terminal",family:"ui",tier:"1",what:"A terminal window replays a short session when it scrolls into view: each command types itself after the prompt, its output appears at once, then the next command starts.",use_when:"The product really is used from a command line (a CLI, a dev tool, an install step), and the session shown is real and copy-pasteable.",avoid_when:'As "techy" decoration for a product with no CLI; sessions longer than about 8 lines; fake output.',reduced_motion:"The whole session is shown at once.",file:"examples/components/ui/terminal.tsx"},{id:"brand-selection",name:"Brand Selection",family:"micro",tier:"1",what:"Text selection uses the brand accent and ink instead of the browser's blue, scoped to a section or the whole page.",use_when:"Almost always; it's a tiny, free detail that shows care.",avoid_when:"The accent and its text colour don't pass 4.5:1 together.",reduced_motion:"Not applicable (no motion).",file:"examples/components/micro/brand-selection.tsx"},{id:"click-spark",name:"Click Spark",family:"micro",tier:"1",what:"A tiny burst of lines radiates from the click point inside a wrapped area, then disappears.",use_when:"Playful brands, games, and one celebratory action (a like, a ticket added).",avoid_when:"Every click on the page; serious briefs; forms.",reduced_motion:"No spark.",file:"examples/components/micro/click-spark.tsx"},{id:"copy-button",name:"Copy Confirm",family:"micro",tier:"1",what:'A copy button whose icon morphs to a tick and whose label says "Copied" for two seconds, then returns.',use_when:"Install commands, email addresses, codes and coupon strings.",avoid_when:"Content the user should read rather than paste.",reduced_motion:"The tick swaps in without the morph.",file:"examples/components/micro/copy-button.tsx"},{id:"count-up",name:"Count Up",family:"micro",tier:"2",what:"A number counts from a start value to its real value once, when it first enters the screen, with tabular figures so it doesn't jitter.",use_when:"Real, sourced figures that are the point of a section (one to three per page).",avoid_when:"Invented or rounded-up stats; prices; anything a screenshot mid-count would misreport (see the v2 benchmark note).",reduced_motion:"Shows the final value at once.",file:"examples/components/micro/count-up.tsx"},{id:"hold-to-commit",name:"Hold to Commit",family:"micro",tier:"2",what:"An important action fills while you press and hold, and only confirms when the fill completes; letting go early drains it back.",use_when:"Irreversible or weighty actions: delete, publish, donate, sign.",avoid_when:"Everyday actions; anything time-critical; as the only way to confirm (keyboard users get Enter-to-hold too).",reduced_motion:"The fill still shows progress (it's information) but with a linear, unanimated drain.",file:"examples/components/micro/hold-to-commit.tsx"},{id:"remembered-list",name:"Remembered List",family:"micro",tier:"1",what:"A list of links quietly marks the ones you've already opened (a small tick and a lighter weight), remembered across visits on this device.",use_when:"Project lists, article archives, course modules, menus people browse more than once.",avoid_when:'Lists that change identity often; sensitive topics where "visited" is private information on shared devices.',reduced_motion:"The mark appears without a transition.",file:"examples/components/micro/remembered-list.tsx"},{id:"squish-switch",name:"Squish Switch",family:"micro",tier:"1",what:"A toggle whose knob stretches while pressed and squashes as it lands on the other side, like a soft rubber key.",use_when:"Play-mood products and settings panels where a little character is welcome.",avoid_when:"Serious financial or medical settings; dense settings tables.",reduced_motion:"The knob moves without stretching.",file:"examples/components/micro/squish-switch.tsx"},{id:"sticker-scatter",name:"Sticker Scatter",family:"micro",tier:"2",what:"Clicking the logo or name bursts a handful of on-brand stickers (emoji or short glyphs) that fly out, spin, land and fade, like emptying a pocket of stickers.",use_when:"Play-mood personal sites, festivals, kids' brands and events; the logo only.",avoid_when:"Serious or institutional briefs; buttons that do something else; repeated clicks on every page element.",reduced_motion:"Stickers appear around the logo and fade without flying or spinning.",file:"examples/components/micro/sticker-scatter.tsx"}]});var qf=Et(B=>{"use strict";E();var fs=Symbol.for("react.transitional.element"),Tg=Symbol.for("react.portal"),Mg=Symbol.for("react.fragment"),Cg=Symbol.for("react.strict_mode"),Rg=Symbol.for("react.profiler"),_g=Symbol.for("react.consumer"),zg=Symbol.for("react.context"),Ng=Symbol.for("react.forward_ref"),Dg=Symbol.for("react.suspense"),Og=Symbol.for("react.memo"),Of=Symbol.for("react.lazy"),Lg=Symbol.for("react.activity"),_f=Symbol.iterator;function Hg(e){return e===null||typeof e!="object"?null:(e=_f&&e[_f]||e["@@iterator"],typeof e=="function"?e:null)}var Lf={isMounted:function(){return!1},enqueueForceUpdate:function(){},enqueueReplace
