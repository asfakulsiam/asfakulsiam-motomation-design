<body class="[--ground:#f4efe6] [--surface:#fbf8f2] [--ink:#1d1a16] [--muted:#5f574b] [--line:rgba(29,26,22,.16)] [--accent:#b5401f] m-0 bg-[var(--ground)] text-[var(--ink)] font-sans text-[17px] leading-[1.55]">
<main class="max-w-[960px] mx-auto px-6 py-16 grid gap-8">
<p class="font-mono text-xs tracking-[.12em] uppercase text-[var(--muted)] m-0">Next free start</p>
<p class="font-serif text-[clamp(2rem,5vw,3.6rem)] leading-[1.1] m-0"><span class="relative inline-flex gap-[0.08em] font-mono" data-mm="split-flap" data-value="JAN 2027" data-cell-class="inline-grid place-items-center min-w-[0.9em] px-[0.06em] py-[0.12em] bg-[var(--ink,#111)] text-[var(--ground,#f4f1ea)] rounded-[3px]">JAN 2027</span></p>
<button type="button" class="justify-self-start px-3.5 py-2 rounded-lg border border-current bg-transparent cursor-pointer" onclick="const f=document.querySelector('[data-mm=split-flap]');f.dataset.value=f.dataset.value==='JAN 2027'?'MAR 2027':'JAN 2027'">Change the date</button>
</main>
<script type="module" src="split-flap.js"></script>
